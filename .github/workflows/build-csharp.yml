name: Build LocaLizard CSharp preview

on:
  push:
    branches: [rewrite/csharp]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build solution
        run: dotnet build dotnet/LocaLizard.sln -c Release
      - name: Run C# smoke tests
        run: dotnet run --project dotnet/LocaLizard.SmokeTests/LocaLizard.SmokeTests.csproj -c Release
      - name: Run Windows DISM WIM integration tests
        run: dotnet run --project dotnet/LocaLizard.WindowsIntegrationTests/LocaLizard.WindowsIntegrationTests.csproj -c Release
      - name: Publish standalone Windows x64 app
        run: dotnet publish dotnet/LocaLizard.App/LocaLizard.App.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true
      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocaLizard-CSharp-Windows-x64
          path: dotnet/LocaLizard.App/bin/Release/net8.0-windows/win-x64/publish/
          if-no-files-found: error
          retention-days: 30
