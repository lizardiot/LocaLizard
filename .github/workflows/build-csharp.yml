name: Build LocaLizard CSharp

on:
  push:
    branches: [rewrite/csharp]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Set up .NET 10.0.403
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.403
      - name: Build solution
        run: dotnet build dotnet/LocaLizard.sln -c Release
      - name: Run C# smoke tests
        run: dotnet run --project dotnet/LocaLizard.SmokeTests/LocaLizard.SmokeTests.csproj -c Release
      - name: Run Windows DISM WIM integration tests
        run: dotnet run --project dotnet/LocaLizard.WindowsIntegrationTests/LocaLizard.WindowsIntegrationTests.csproj -c Release
      - name: Publish standalone Windows x64 app
        run: dotnet publish dotnet/LocaLizard.App/LocaLizard.App.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true
      - name: Upload Windows x64 CI artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: LocaLizard-0.7.2-Windows-x64
          path: dotnet/LocaLizard.App/bin/Release/net10.0-windows/win-x64/publish/
          if-no-files-found: error
          retention-days: 30
