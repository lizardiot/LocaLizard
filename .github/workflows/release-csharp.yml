name: Publish LocaLizard CSharp 0.2.2.8

on:
  push:
    branches: [main]
    paths:
      - "dotnet/**"
      - "README.md"
      - "README_EN.md"
      - "CHANGELOG.md"
      - ".github/workflows/release-csharp.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'push' &&
           contains(github.event.head_commit.message, 'release-csharp-0.2.2.8')) }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Verify release version
        shell: pwsh
        run: |
          $models = Get-Content -Raw "dotnet/LocaLizard.Core/Models.cs"
          if ($models -notmatch 'public const string Version = "0\.2\.2\.8";') {
            throw "AppInfo.Version is not 0.2.2.8."
          }
          $project = Get-Content -Raw "dotnet/LocaLizard.App/LocaLizard.App.csproj"
          if ($project -notmatch '<Version>0\.2\.2\.8</Version>') {
            throw "Windows assembly metadata is not versioned 0.2.2.8."
          }

      - name: Build solution
        run: dotnet build dotnet/LocaLizard.sln -c Release

      - name: Run C# regression tests
        run: dotnet run --project dotnet/LocaLizard.SmokeTests/LocaLizard.SmokeTests.csproj -c Release

      - name: Run Windows DISM WIM integration tests
        run: dotnet run --project dotnet/LocaLizard.WindowsIntegrationTests/LocaLizard.WindowsIntegrationTests.csproj -c Release

      - name: Publish standalone Windows x64 application
        run: dotnet publish dotnet/LocaLizard.App/LocaLizard.App.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true

      - name: Package release assets and checksums
        shell: pwsh
        run: |
          $publish = "dotnet/LocaLizard.App/bin/Release/net8.0-windows/win-x64/publish"
          if (-not (Test-Path "$publish/LocaLizard.exe")) { throw "LocaLizard.exe was not published." }
          $assets = "release-assets"
          New-Item -ItemType Directory -Force -Path $assets | Out-Null
          Copy-Item "$publish/LocaLizard.exe" "$assets/LocaLizard.exe" -Force
          Compress-Archive -Path "$publish/*" -DestinationPath "$assets/LocaLizard-0.2.2.8-win-x64.zip" -Force
          $files = @("$assets/LocaLizard.exe", "$assets/LocaLizard-0.2.2.8-win-x64.zip")
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Path $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $(Split-Path $file -Leaf)"
          }
          Set-Content -Path "$assets/SHA256.txt" -Value $lines -Encoding ascii

      - name: Ensure release tag is new
        id: tag
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: "tags/0.2.2.8"
              });
              core.setFailed("Tag 0.2.2.8 already exists; refusing to overwrite a previous release.");
            } catch (error) {
              if (error.status === 404) {
                core.info("Tag 0.2.2.8 is available.");
              } else {
                throw error;
              }
            }

      - name: Publish GitHub Release
        if: steps.tag.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: 0.2.2.8
          target_commitish: ${{ github.sha }}
          name: LocaLizard 0.2.2.8
          draft: false
          prerelease: false
          files: |
            release-assets/LocaLizard.exe
            release-assets/LocaLizard-0.2.2.8-win-x64.zip
            release-assets/SHA256.txt
          body: |
            ## LocaLizard 0.2.2.8 — C# / .NET 8

            The primary Windows application is now implemented in C# / .NET 8 Windows Forms. Historical Python sources, previous Git tags, and earlier GitHub Releases remain preserved.

            ### Included
            - Windows Forms UI, settings migration, drag-and-drop, logging, cancellation and UAC resume.
            - DISM WIM/ESD inventory and servicing, Russian Client Language Pack discovery, validation and managed cache integrity.
            - UUP Dump API diagnostics and retry/resume downloads from trusted Microsoft CDN endpoints.
            - Microsoft Update Catalog, ordered update manifests, FOD/L&O, ADK/WinPE and Setup/WinPE/WinRE localization.
            - Split-WIM support, patch-existing-WIM, ISO creation, static verification and JSON audit.
            - Optional Hyper-V boot test with network disabled and operator confirmation.

            ### Validation
            Windows CI builds the solution, runs C# regression tests, exercises DISM Capture/Append/Get-WimInfo/Mount/Commit/Apply against a synthetic two-index WIM, and publishes the standalone x64 application.

            **Important:** this synthetic WIM round-trip does not replace servicing real Windows IoT Enterprise LTSC ISO/WIM images. Applicability of individual language/update packages, ADK/WinPE installation, final bootable ISO creation on target media, and visual Hyper-V Setup confirmation must be verified with the specific licensed source images and Windows environment.

