name: Publish LocaLizard CSharp 0.2.2.8

on:
  push:
    branches: [main]
    paths:
      - "dotnet/**"
      - "assets/LocaLizard.ico"
      - "README.md"
      - "README_EN.md"
      - "CHANGELOG.md"
      - ".github/workflows/release-csharp.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'push' &&
           contains(github.event.head_commit.message, 'release-csharp-0.2.2.8')) }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Verify release version
        shell: pwsh
        run: |
          $models = Get-Content -Raw "dotnet/LocaLizard.Core/Models.cs"
          if ($models -notmatch 'public const string Version = "0\.2\.2\.8";') {
            throw "AppInfo.Version is not 0.2.2.8."
          }
          $project = Get-Content -Raw "dotnet/LocaLizard.App/LocaLizard.App.csproj"
          if ($project -notmatch '<Version>0\.2\.2\.8</Version>') {
            throw "Windows assembly metadata is not versioned 0.2.2.8."
          }

      - name: Build solution
        run: dotnet build dotnet/LocaLizard.sln -c Release

      - name: Run C# regression tests
        run: dotnet run --project dotnet/LocaLizard.SmokeTests/LocaLizard.SmokeTests.csproj -c Release

      - name: Run Windows DISM WIM integration tests
        run: dotnet run --project dotnet/LocaLizard.WindowsIntegrationTests/LocaLizard.WindowsIntegrationTests.csproj -c Release

      - name: Generate multi-size Windows icon for Explorer views
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $source = [System.Drawing.Icon]::new((Resolve-Path "assets/LocaLizard.ico").Path)
          $base = $source.ToBitmap()
          $sizes = @(16, 24, 32, 48, 64, 128, 256)
          $frames = @()
          try {
            foreach ($size in $sizes) {
              $bitmap = [System.Drawing.Bitmap]::new($size, $size, [System.Drawing.Imaging.PixelFormat]::Format32bppArgb)
              $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
              try {
                $graphics.Clear([System.Drawing.Color]::Transparent)
                $graphics.InterpolationMode = [System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
                $graphics.SmoothingMode = [System.Drawing.Drawing2D.SmoothingMode]::HighQuality
                $graphics.PixelOffsetMode = [System.Drawing.Drawing2D.PixelOffsetMode]::HighQuality
                $graphics.DrawImage($base, 0, 0, $size, $size)
                $stream = [System.IO.MemoryStream]::new()
                $bitmap.Save($stream, [System.Drawing.Imaging.ImageFormat]::Png)
                $frames += ,@{ Size = $size; Bytes = $stream.ToArray() }
                $stream.Dispose()
              }
              finally {
                $graphics.Dispose()
                $bitmap.Dispose()
              }
            }
            $output = [System.IO.File]::Create("assets/LocaLizard.ico")
            $writer = [System.IO.BinaryWriter]::new($output)
            try {
              $writer.Write([UInt16]0)
              $writer.Write([UInt16]1)
              $writer.Write([UInt16]$frames.Count)
              $offset = 6 + (16 * $frames.Count)
              foreach ($frame in $frames) {
                $dimension = if ($frame.Size -eq 256) { [byte]0 } else { [byte]$frame.Size }
                $writer.Write($dimension)
                $writer.Write($dimension)
                $writer.Write([byte]0)
                $writer.Write([byte]0)
                $writer.Write([UInt16]1)
                $writer.Write([UInt16]32)
                $writer.Write([UInt32]$frame.Bytes.Length)
                $writer.Write([UInt32]$offset)
                $offset += $frame.Bytes.Length
              }
              foreach ($frame in $frames) { $writer.Write([byte[]]$frame.Bytes) }
            }
            finally {
              $writer.Dispose()
              $output.Dispose()
            }
          }
          finally {
            $base.Dispose()
            $source.Dispose()
          }
          $ico = [System.IO.File]::ReadAllBytes("assets/LocaLizard.ico")
          $count = [BitConverter]::ToUInt16($ico, 4)
          if ($count -ne 7) { throw "Expected 7 icon sizes, found $count." }
          Write-Host "Generated multi-size ICO with 16, 24, 32, 48, 64, 128 and 256 pixel images."

      - name: Publish standalone Windows x64 application
        run: dotnet publish dotnet/LocaLizard.App/LocaLizard.App.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true

      - name: Verify dragon-eye icon is embedded in published EXE
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $exe = Resolve-Path "dotnet/LocaLizard.App/bin/Release/net8.0-windows/win-x64/publish/LocaLizard.exe"
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon($exe.Path)
          if ($null -eq $icon) { throw "Published EXE has no extractable application icon." }
          $bitmap = $icon.ToBitmap()
          try {
            $greenPixels = 0
            for ($y = 0; $y -lt $bitmap.Height; $y++) {
              for ($x = 0; $x -lt $bitmap.Width; $x++) {
                $pixel = $bitmap.GetPixel($x, $y)
                if (($pixel.G -gt 80) -and ($pixel.G -gt ($pixel.R * 1.2)) -and ($pixel.G -gt ($pixel.B * 1.2))) {
                  $greenPixels++
                }
              }
            }
            if ($greenPixels -lt 20) {
              throw "Published EXE does not contain the expected neon-green dragon-eye icon."
            }
            Write-Host "Verified embedded dragon-eye icon: $($bitmap.Width)x$($bitmap.Height), green pixels=$greenPixels."
          }
          finally {
            $bitmap.Dispose()
            $icon.Dispose()
          }

      - name: Verify small and large Explorer icon variants in EXE
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $source = @'
          using System;
          using System.Runtime.InteropServices;
          public static class ShellIconCheck {
            [DllImport("shell32.dll", CharSet = CharSet.Unicode)]
            public static extern uint ExtractIconEx(string file, int index, IntPtr[] large, IntPtr[] small, uint count);
            [DllImport("user32.dll", SetLastError = true)]
            [return: MarshalAs(UnmanagedType.Bool)]
            public static extern bool DestroyIcon(IntPtr icon);
          }
          '@
          Add-Type -TypeDefinition $source
          $exe = (Resolve-Path "dotnet/LocaLizard.App/bin/Release/net8.0-windows/win-x64/publish/LocaLizard.exe").Path
          $large = [IntPtr[]]::new(1)
          $small = [IntPtr[]]::new(1)
          $count = [ShellIconCheck]::ExtractIconEx($exe, 0, $large, $small, 1)
          if ($count -lt 1 -or $large[0] -eq [IntPtr]::Zero -or $small[0] -eq [IntPtr]::Zero) {
            throw "Windows Shell could not extract both large and small icons from the published EXE."
          }
          try {
            $largeIcon = [System.Drawing.Icon]::FromHandle($large[0])
            $smallIcon = [System.Drawing.Icon]::FromHandle($small[0])
            if ($smallIcon.Width -gt 16 -or $smallIcon.Height -gt 16) {
              throw "Small Shell icon is not 16x16: $($smallIcon.Width)x$($smallIcon.Height)"
            }
            if ($largeIcon.Width -lt 32 -or $largeIcon.Height -lt 32) {
              throw "Large Shell icon is smaller than 32x32: $($largeIcon.Width)x$($largeIcon.Height)"
            }
            Write-Host "Windows Shell extracted small icon $($smallIcon.Width)x$($smallIcon.Height) and large icon $($largeIcon.Width)x$($largeIcon.Height)."
          }
          finally {
            if ($large[0] -ne [IntPtr]::Zero) {
              if (-not [ShellIconCheck]::DestroyIcon($large[0])) { throw "DestroyIcon failed for the large HICON." }
            }
            if ($small[0] -ne [IntPtr]::Zero) {
              if (-not [ShellIconCheck]::DestroyIcon($small[0])) { throw "DestroyIcon failed for the small HICON." }
            }
          }

      - name: Verify icon resource contains all Explorer sizes
        shell: pwsh
        run: |
          $icon = [System.IO.File]::ReadAllBytes("assets/LocaLizard.ico")
          if ($icon.Length -lt 6) { throw "ICO file is truncated." }
          $reserved = [BitConverter]::ToUInt16($icon, 0)
          $type = [BitConverter]::ToUInt16($icon, 2)
          $count = [BitConverter]::ToUInt16($icon, 4)
          if ($reserved -ne 0 -or $type -ne 1 -or $count -ne 7) {
            throw "ICO header is invalid or does not contain seven images."
          }
          $sizes = @()
          for ($i = 0; $i -lt $count; $i++) {
            $offset = 6 + (16 * $i)
            $width = [int]$icon[$offset]
            if ($width -eq 0) { $width = 256 }
            $sizes += $width
          }
          $expected = @(16, 24, 32, 48, 64, 128, 256)
          if (Compare-Object $expected $sizes) {
            throw "ICO sizes differ from expected set. Found: $($sizes -join ', ')."
          }
          Write-Host "Verified ICO contains 16, 24, 32, 48, 64, 128 and 256 px variants."

      - name: Package release assets and checksums
        shell: pwsh
        run: |
          $publish = "dotnet/LocaLizard.App/bin/Release/net8.0-windows/win-x64/publish"
          if (-not (Test-Path "$publish/LocaLizard.exe")) { throw "LocaLizard.exe was not published." }
          $assets = "release-assets"
          New-Item -ItemType Directory -Force -Path $assets | Out-Null
          Copy-Item "$publish/LocaLizard.exe" "$assets/LocaLizard.exe" -Force
          Compress-Archive -Path "$publish/*" -DestinationPath "$assets/LocaLizard-0.2.2.8-win-x64.zip" -Force
          $files = @("$assets/LocaLizard.exe", "$assets/LocaLizard-0.2.2.8-win-x64.zip")
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Path $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $(Split-Path $file -Leaf)"
          }
          Set-Content -Path "$assets/SHA256.txt" -Value $lines -Encoding ascii

          $changelog = Get-Content -Raw -Encoding UTF8 "CHANGELOG.md"
          $releaseSection = [regex]::Match($changelog, '(?ms)^## \[0\.2\.2\.8\].*?(?=^## \[|\z)')
          if (-not $releaseSection.Success) { throw "CHANGELOG.md has no Russian section for 0.2.2.8." }
          Set-Content -Path "$assets/CHANGELOG.md" -Value ($releaseSection.Value.Trim() + [Environment]::NewLine) -Encoding UTF8

      - name: Verify release tag without moving it
        id: tag
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: "tags/0.2.2.8"
              });
              const comparison = await github.rest.repos.compareCommits({
                owner: context.repo.owner,
                repo: context.repo.repo,
                base: "0.2.2.8",
                head: context.sha
              });
              if (!["ahead", "identical"].includes(comparison.data.status)) {
                core.setFailed("Current main commit is not a descendant of the existing 0.2.2.8 tag; refusing to alter the release.");
              } else {
                core.info("Existing 0.2.2.8 tag is preserved; only the release notes and assets will be refreshed.");
              }
            } catch (error) {
              if (error.status === 404) {
                core.info("Tag 0.2.2.8 does not exist yet; the release action may create it.");
              } else {
                throw error;
              }
            }

      - name: Publish GitHub Release
        if: steps.tag.outcome == 'success'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: 0.2.2.8
          target_commitish: ${{ github.sha }}
          name: LocaLizard 0.2.2.8
          draft: false
          prerelease: false
          overwrite_files: true
          files: |
            release-assets/LocaLizard.exe
            release-assets/LocaLizard-0.2.2.8-win-x64.zip
            release-assets/SHA256.txt
            release-assets/CHANGELOG.md
          body_path: release-assets/CHANGELOG.md

      - name: Synchronize release description with Russian changelog
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const body = fs.readFileSync("release-assets/CHANGELOG.md", "utf8");
            const { data: release } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: "0.2.2.8"
            });
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.id,
              body
            });
            const { data: verified } = await github.rest.repos.getRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.id
            });
            if (verified.body !== body) {
              core.setFailed("GitHub Release description differs from the Russian CHANGELOG.md.");
            } else {
              core.info("The GitHub Release description now matches the Russian CHANGELOG.md exactly.");
            }

