name: Build LocaLizard Windows EXE
on:
  push:
    branches: [main]
    tags: ["0.0.*", "v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        name: Checkout source
      - uses: actions/setup-python@v5
        name: Set up Python
        with:
          python-version: "3.12"
          architecture: x64
      - name: Assemble application source
        shell: pwsh
        run: |
          $parts = Get-ChildItem -Path "source" -Filter "main.py.part*" | Sort-Object Name
          if (-not $parts -or $parts.Count -lt 2) { throw "Application source parts are missing." }
          $content = ($parts | ForEach-Object { Get-Content -Raw -Encoding UTF8 $_.FullName }) -join ""
          $content = $content.Replace("IoT LTSC Russianizer", "LocaLizard").Replace("IoTLTSC_Russianizer", "LocaLizard").Replace("IoT_LTSC_Russianizer", "LocaLizard")
          $content = [regex]::Replace($content, '(?m)^if __name__ == "__main__":\r?\n    main\(\)\r?\n?', "")
          # APP_VERSION is read from source/main.py.part01; do not overwrite it here.
          $content += [Environment]::NewLine + 'if __name__ == "__main__":' + [Environment]::NewLine + '    main()' + [Environment]::NewLine
          Set-Content -Path "main.py" -Value $content -Encoding UTF8
          python -m py_compile main.py
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller tkinterdnd2
      - name: Run automated tests
        run: |
          python -m py_compile main.py test_helpers.py
          python -m unittest -v test_helpers
      - name: Build standalone EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name LocaLizard --collect-all tkinterdnd2 main.py
          if (-not (Test-Path "dist/LocaLizard.exe")) { throw "EXE build did not produce an output file." }
          $f = Get-Item "dist/LocaLizard.exe"
          if ($f.Length -lt 1000000) { throw "EXE is unexpectedly small ($($f.Length) bytes)." }
          Get-FileHash "dist/LocaLizard.exe" -Algorithm SHA256 | Format-List | Out-File "dist/SHA256.txt"
          Copy-Item "README.md" "dist/README.md"
          Copy-Item "README_RU.md" "dist/README_RU.md"
          Copy-Item "CHANGELOG.md" "dist/CHANGELOG.md"
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocaLizard-Windows-x64
          path: |
            dist/LocaLizard.exe
            dist/SHA256.txt
            dist/README.md
            dist/README_RU.md
            dist/CHANGELOG.md
          if-no-files-found: error
          retention-days: 30
      - name: Publish versioned release
        if: success() && ((startsWith(github.ref, 'refs/tags/')) || (github.ref == 'refs/heads/main' && github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release:')))
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $m = [regex]::Match((Get-Content -Raw -Encoding UTF8 "main.py"), 'APP_VERSION = "([^"]+)"')
          if (-not $m.Success) { throw "Could not detect APP_VERSION." }
          $version = $m.Groups[1].Value
          if ($env:GITHUB_REF -like "refs/tags/*") {
            $tag = $env:GITHUB_REF_NAME
            if (($tag -replace '^v', '') -ne $version) { throw "Tag $tag does not match source version $version." }
          } else {
            $tag = $version
            $event = Get-Content -Raw $env:GITHUB_EVENT_PATH | ConvertFrom-Json
            if (-not $event.head_commit.message.StartsWith("release:") -or $event.head_commit.message -notlike "*$version*") { throw "Release commit must start with release: and include $version." }
          }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { Write-Host "Release $tag already exists; preserving it."; exit 0 }
          gh release create "$tag" "dist/LocaLizard.exe" "dist/SHA256.txt" "README.md" "README_RU.md" "CHANGELOG.md" --target "$env:GITHUB_SHA" --title "LocaLizard $version" --notes-file "CHANGELOG.md" --latest
          if ($LASTEXITCODE -ne 0) { throw "Failed to publish release $tag" }
