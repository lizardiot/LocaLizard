name: Build LocaLizard Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: localizard-windows-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      - name: Assemble application source
        shell: pwsh
        run: |
          $parts = Get-ChildItem -Path "source" -Filter "main.py.part*" | Sort-Object Name
          if (-not $parts -or $parts.Count -lt 2) { throw "Application source parts are missing." }
          $content = ($parts | ForEach-Object { Get-Content -Raw -Encoding UTF8 $_.FullName }) -join ""
          Set-Content -Path "main.py" -Value $content -Encoding UTF8
          python -m py_compile main.py

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller tkinterdnd2

      - name: Run automated tests
        run: |
          python -m py_compile main.py test_helpers.py
          python -m unittest -v test_helpers

      - name: Build standalone EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name LocaLizard --collect-all tkinterdnd2 main.py
          if (-not (Test-Path "dist/LocaLizard.exe")) { throw "EXE build did not produce an output file." }
          $f = Get-Item "dist/LocaLizard.exe"
          if ($f.Length -lt 1000000) { throw "EXE is unexpectedly small ($($f.Length) bytes)." }
          Get-FileHash "dist/LocaLizard.exe" -Algorithm SHA256 | Format-List | Out-File "dist/SHA256.txt"
          Copy-Item "README.md" "dist/README.md"
          Copy-Item "CHANGELOG.md" "dist/CHANGELOG.md"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocaLizard-Windows-x64
          path: |
            dist/LocaLizard.exe
            dist/SHA256.txt
            dist/README.md
            dist/CHANGELOG.md
          if-no-files-found: error
          retention-days: 30

      - name: Publish LocaLizard 0.0.1.8 and keep only this release
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          # A newer commit cancels/invalidates this release run so an older build cannot overwrite the latest release.
          $head = gh api "repos/$env:GITHUB_REPOSITORY/commits/main" --jq ".sha"
          if ($head -ne $env:GITHUB_SHA) {
            Write-Host "Skipping release because main has advanced to $head."
            exit 0
          }

          # Remove all previous releases. The replacement release is created only after this build passed tests.
          $releases = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | ConvertFrom-Json
          foreach ($release in $releases) {
            Write-Host "Removing older release: $($release.tag_name)"
            gh api --method DELETE "repos/$env:GITHUB_REPOSITORY/releases/$($release.id)"
            if ($LASTEXITCODE -ne 0) { throw "Failed to remove old release $($release.tag_name)" }
          }

          # Remove old tags too, including a prior 0.0.1.8, so the release points at this exact build.
          $tags = gh api "repos/$env:GITHUB_REPOSITORY/git/matching-refs/tags/" | ConvertFrom-Json
          foreach ($tag in $tags) {
            $short = $tag.ref.Substring("refs/tags/".Length)
            Write-Host "Removing old tag: $short"
            gh api --method DELETE "repos/$env:GITHUB_REPOSITORY/git/refs/tags/$short"
            if ($LASTEXITCODE -ne 0) { throw "Failed to remove tag $short" }
          }

          gh release create "0.0.1.8" "dist/LocaLizard.exe" "dist/SHA256.txt" "README.md" "CHANGELOG.md" --title "LocaLizard 0.0.1.8" --notes-file "CHANGELOG.md" --latest
          if ($LASTEXITCODE -ne 0) { throw "Failed to publish release LocaLizard 0.0.1.8" }
