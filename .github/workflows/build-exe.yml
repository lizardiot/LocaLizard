name: Build LocaLizard Windows EXE
on:
  push:
    branches: [main]
    tags: ["0.0.*", "v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        name: Checkout source
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        name: Set up Python
        with:
          python-version: "3.12"
          architecture: x64
      - name: Assemble application source
        shell: pwsh
        run: |
          $parts = Get-ChildItem -Path "source" -Filter "main.py.part*" | Sort-Object Name
          if (-not $parts -or $parts.Count -lt 2) { throw "Application source parts are missing." }
          $content = ($parts | ForEach-Object { Get-Content -Raw -Encoding UTF8 $_.FullName }) -join ""
          $content = $content.Replace("IoT LTSC Russianizer", "LocaLizard").Replace("IoTLTSC_Russianizer", "LocaLizard").Replace("IoT_LTSC_Russianizer", "LocaLizard")
          $content = [regex]::Replace($content, '(?m)^if __name__ == "__main__":\r?\n    main\(\)\r?\n?', "")
          # APP_VERSION comes from source/main.py.part01 and must not be overwritten in CI.
          $content += [Environment]::NewLine + 'if __name__ == "__main__":' + [Environment]::NewLine + '    main()' + [Environment]::NewLine
          Set-Content -Path "main.py" -Value $content -Encoding UTF8
          python -m py_compile main.py
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller tkinterdnd2
      - name: Run automated tests
        run: |
          python -m py_compile main.py test_helpers.py
          python -m unittest -v test_helpers
      - name: Build standalone EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name LocaLizard --collect-all tkinterdnd2 main.py
          if (-not (Test-Path "dist/LocaLizard.exe")) { throw "EXE build did not produce an output file." }
          $f = Get-Item "dist/LocaLizard.exe"
          if ($f.Length -lt 1000000) { throw "EXE is unexpectedly small ($($f.Length) bytes)." }
          $hash = (Get-FileHash "dist/LocaLizard.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path "dist/SHA256.txt" -Value "$hash  LocaLizard.exe" -Encoding UTF8

          $versionMatch = [regex]::Match((Get-Content -Raw -Encoding UTF8 "main.py"), 'APP_VERSION = "([^"]+)"')
          if (-not $versionMatch.Success) { throw "Could not detect APP_VERSION." }
          $version = $versionMatch.Groups[1].Value
          $fullChangelog = Get-Content -Raw -Encoding UTF8 "CHANGELOG.md"
          $releasePattern = "(?ms)^## \[" + [regex]::Escape($version) + "\].*?(?=^## \[|\z)"
          $releaseSection = [regex]::Match($fullChangelog, $releasePattern)
          if (-not $releaseSection.Success) { throw "CHANGELOG.md has no version-specific section for $version." }
          # The release asset contains this release only; the repository CHANGELOG retains full history.
          Set-Content -Path "dist/CHANGELOG.md" -Value ($releaseSection.Value.Trim() + [Environment]::NewLine) -Encoding UTF8
          Copy-Item "README.md" "dist/README.md"
          Copy-Item "README_RU.md" "dist/README_RU.md"
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocaLizard-Windows-x64
          path: |
            dist/LocaLizard.exe
            dist/SHA256.txt
            dist/README.md
            dist/README_RU.md
            dist/CHANGELOG.md
          if-no-files-found: error
          retention-days: 30
      - name: Publish versioned release and normalize legacy tags
        if: success() && ((startsWith(github.ref, 'refs/tags/')) || (github.ref == 'refs/heads/main' && github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release:')))
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $versionMatch = [regex]::Match((Get-Content -Raw -Encoding UTF8 "main.py"), 'APP_VERSION = "([^"]+)"')
          if (-not $versionMatch.Success) { throw "Could not detect APP_VERSION." }
          $version = $versionMatch.Groups[1].Value

          if ($env:GITHUB_REF -like "refs/tags/*") {
            $tag = $env:GITHUB_REF_NAME
            if (($tag -replace '^v', '') -ne $version) { throw "Tag $tag does not match source version $version." }
          } else {
            $tag = $version
            $event = Get-Content -Raw $env:GITHUB_EVENT_PATH | ConvertFrom-Json
            if (-not $event.head_commit.message.StartsWith("release:") -or $event.head_commit.message -notlike "*$version*") {
              throw "Release commit must start with release: and include $version."
            }
          }

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; refreshing version-specific notes and docs while preserving EXE assets."
            gh release upload "$tag" "dist/CHANGELOG.md" "dist/README.md" "dist/README_RU.md" --clobber
            if ($LASTEXITCODE -ne 0) { throw "Failed to refresh release assets for $tag" }
            gh release edit "$tag" --title "LocaLizard $version" --notes-file "dist/CHANGELOG.md"
            if ($LASTEXITCODE -ne 0) { throw "Failed to refresh notes for $tag" }
          } else {
            gh release create "$tag" "dist/LocaLizard.exe" "dist/SHA256.txt" "dist/README.md" "dist/README_RU.md" "dist/CHANGELOG.md" --target "$env:GITHUB_SHA" --title "LocaLizard $version" --notes-file "dist/CHANGELOG.md" --latest
            if ($LASTEXITCODE -ne 0) { throw "Failed to publish release $tag" }
          }

          if ($version -eq "0.0.9") {
            # Rename 0.0.9.0 after the new 0.0.9 release is published.
            gh release view "0.0.9.0" *> $null
            if ($LASTEXITCODE -eq 0) {
              gh release delete "0.0.9.0" --yes --cleanup-tag
              if ($LASTEXITCODE -ne 0) { throw "Failed to remove superseded tag/release 0.0.9.0" }
              Write-Host "Renamed release 0.0.9.0 to 0.0.9."
            }

            # Rebuild the historical 0.0.2 source with its shortened version string before renaming its tag.
            gh release view "0.0.2.0" *> $null
            if ($LASTEXITCODE -eq 0) {
              $oldTagSha = (gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/0.0.2.0" --jq ".object.sha").Trim()
              if ($LASTEXITCODE -ne 0 -or -not $oldTagSha) { throw "Could not resolve historical tag 0.0.2.0." }
              git fetch origin "refs/tags/0.0.2.0:refs/tags/0.0.2.0"
              if ($LASTEXITCODE -ne 0) { throw "Could not fetch historical source for 0.0.2.0." }
              git worktree add --detach "legacy-src-0.0.2" $oldTagSha
              if ($LASTEXITCODE -ne 0) { throw "Could not create the historical 0.0.2 worktree." }

              $legacyParts = Get-ChildItem -Path "legacy-src-0.0.2/source" -Filter "main.py.part*" | Sort-Object Name
              if (-not $legacyParts -or $legacyParts.Count -lt 2) { throw "Historical source parts for 0.0.2 are missing." }
              $legacyContent = ($legacyParts | ForEach-Object { Get-Content -Raw -Encoding UTF8 $_.FullName }) -join ""
              $legacyContent = $legacyContent.Replace("IoT LTSC Russianizer", "LocaLizard").Replace("IoTLTSC_Russianizer", "LocaLizard").Replace("IoT_LTSC_Russianizer", "LocaLizard")
              $legacyContent = [regex]::Replace($legacyContent, '(?m)^if __name__ == "__main__":\r?\n    main\(\)\r?\n?', "")
              $legacyContent = [regex]::Replace($legacyContent, 'APP_VERSION = "0\.0\.2\.0"', 'APP_VERSION = "0.0.2"')
              if ($legacyContent -notmatch 'APP_VERSION = "0\.0\.2"') { throw "Could not set historical APP_VERSION to 0.0.2." }
              $legacyContent += [Environment]::NewLine + 'if __name__ == "__main__":' + [Environment]::NewLine + '    main()' + [Environment]::NewLine
              Set-Content -Path "legacy-src-0.0.2/main.py" -Value $legacyContent -Encoding UTF8

              Push-Location "legacy-src-0.0.2"
              try {
                python -m py_compile main.py test_helpers.py
                if ($LASTEXITCODE -ne 0) { throw "Historical 0.0.2 source failed syntax compilation." }
                python -m unittest -v test_helpers
                if ($LASTEXITCODE -ne 0) { throw "Historical 0.0.2 tests failed." }
                pyinstaller --noconfirm --clean --onefile --windowed --name LocaLizard --collect-all tkinterdnd2 main.py
                if ($LASTEXITCODE -ne 0 -or -not (Test-Path "dist/LocaLizard.exe")) { throw "Failed to rebuild historical 0.0.2 EXE." }
                if ((Get-Item "dist/LocaLizard.exe").Length -lt 1000000) { throw "Historical 0.0.2 EXE is unexpectedly small." }
                $legacyHash = (Get-FileHash "dist/LocaLizard.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
              } finally {
                Pop-Location
              }

              New-Item -ItemType Directory -Force -Path "legacy-release-0.0.2" | Out-Null
              Copy-Item "legacy-src-0.0.2/dist/LocaLizard.exe" "legacy-release-0.0.2/LocaLizard.exe"
              Set-Content -Path "legacy-release-0.0.2/SHA256.txt" -Value "$legacyHash  LocaLizard.exe" -Encoding UTF8
              $oldEntryPattern = "(?ms)^## \[0\.0\.2\].*?(?=^## \[|\z)"
              $oldEntry = [regex]::Match((Get-Content -Raw -Encoding UTF8 "CHANGELOG.md"), $oldEntryPattern)
              if (-not $oldEntry.Success) { throw "CHANGELOG.md has no version-specific section for 0.0.2." }
              Set-Content -Path "legacy-release-0.0.2/CHANGELOG.md" -Value ($oldEntry.Value.Trim() + [Environment]::NewLine) -Encoding UTF8
              Set-Content -Path "legacy-release-0.0.2/README.md" -Value ("# LocaLizard 0.0.2" + [Environment]::NewLine + [Environment]::NewLine + "Historical release. Full project history: https://github.com/lizardiot/LocaLizard/blob/main/CHANGELOG.md" + [Environment]::NewLine) -Encoding UTF8
              Set-Content -Path "legacy-release-0.0.2/README_RU.md" -Value ("# LocaLizard 0.0.2" + [Environment]::NewLine + [Environment]::NewLine + "Исторический выпуск LocaLizard. Другие версии: https://github.com/lizardiot/LocaLizard/releases" + [Environment]::NewLine) -Encoding UTF8

              gh release view "0.0.2" *> $null
              if ($LASTEXITCODE -eq 0) {
                gh release upload "0.0.2" "legacy-release-0.0.2/LocaLizard.exe" "legacy-release-0.0.2/SHA256.txt" "legacy-release-0.0.2/CHANGELOG.md" "legacy-release-0.0.2/README.md" "legacy-release-0.0.2/README_RU.md" --clobber
                if ($LASTEXITCODE -ne 0) { throw "Failed to refresh assets for release 0.0.2." }
                gh release edit "0.0.2" --title "LocaLizard 0.0.2" --notes-file "legacy-release-0.0.2/CHANGELOG.md"
                if ($LASTEXITCODE -ne 0) { throw "Failed to update release notes for 0.0.2." }
              } else {
                gh release create "0.0.2" "legacy-release-0.0.2/LocaLizard.exe" "legacy-release-0.0.2/SHA256.txt" "legacy-release-0.0.2/README.md" "legacy-release-0.0.2/README_RU.md" "legacy-release-0.0.2/CHANGELOG.md" --target "$oldTagSha" --title "LocaLizard 0.0.2" --notes-file "legacy-release-0.0.2/CHANGELOG.md"
                if ($LASTEXITCODE -ne 0) { throw "Failed to create release 0.0.2." }
              }

              gh release delete "0.0.2.0" --yes --cleanup-tag
              if ($LASTEXITCODE -ne 0) { throw "Failed to remove superseded tag/release 0.0.2.0." }
              git worktree remove --force "legacy-src-0.0.2"
              Write-Host "Renamed historical release 0.0.2.0 to 0.0.2 and rebuilt its EXE with APP_VERSION 0.0.2."
            } else {
              Write-Host "Release 0.0.2.0 is already gone; no historical tag migration needed."
            }
          }
