name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      - name: Assemble application source
        shell: pwsh
        run: |
          $parts = Get-ChildItem -Path "source" -Filter "main.py.part*" | Sort-Object Name
          if (-not $parts -or $parts.Count -lt 2) { throw "Application source parts are missing." }
          $content = ($parts | ForEach-Object { Get-Content -Raw -Encoding UTF8 $_.FullName }) -join ""
          Set-Content -Path "main.py" -Value $content -Encoding UTF8
          python -m py_compile main.py

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller tkinterdnd2

      - name: Run automated tests
        run: |
          python -m py_compile main.py test_helpers.py
          python -m unittest -v test_helpers

      - name: Build standalone EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name IoT_LTSC_Russianizer --collect-all tkinterdnd2 main.py
          if (-not (Test-Path "dist/IoT_LTSC_Russianizer.exe")) { throw "EXE build did not produce an output file." }
          $f = Get-Item "dist/IoT_LTSC_Russianizer.exe"
          if ($f.Length -lt 1000000) { throw "EXE is unexpectedly small ($($f.Length) bytes)." }
          Get-FileHash "dist/IoT_LTSC_Russianizer.exe" -Algorithm SHA256 | Format-List | Out-File "dist/SHA256.txt"
          Copy-Item "README_RU.md" "dist/README_RU.txt" -ErrorAction SilentlyContinue

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: IoT-LTSC-Russianizer-Windows-x64
          path: |
            dist/IoT_LTSC_Russianizer.exe
            dist/SHA256.txt
            dist/README_RU.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish downloadable GitHub release
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "build-$env:GITHUB_RUN_NUMBER"
          gh release create $tag "dist/IoT_LTSC_Russianizer.exe" "dist/SHA256.txt" --title "IoT LTSC Russianizer build $env:GITHUB_RUN_NUMBER" --notes "Automated Windows x64 build. This release contains the standalone EXE and SHA-256 checksum. Review README_RU for current scope and limitations." --latest
